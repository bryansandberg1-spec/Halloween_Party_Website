document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x;margin:0 auto;padding:70px 32px 0\" id=\"rsvp\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px\">\n      <div>\n        <div style=\"font-family:var(--fd);font-size:clamp(38px,5vw,62px);line-height:0.95;letter-spacing:1px\">ARE YOU<br>COMING?<\u002Fdiv>\n        <p style=\"color:var(--dim);font-size:15px;line-height:1.6;max-width:38ch\">One form, three answers. Your reply shows up on the guest list below within a few seconds, and everyone else sees it too. Change your mind later and just send it again — the newest reply wins.<\u002Fp>\n        <div style=\"font-family:var(--ft);font-size:13px;color:var(--dim);margin-top:20px\">Questions? Bryan — {{ hostPhone }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--line);background:var(--panel);padding:28px\">\n        <sc-for list=\"{{ rsvpFields }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div style=\"margin-bottom:16px\">\n            <label style=\"display:block;font-family:var(--ft);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px\">{{ f.label }}<\u002Flabel>\n            <sc-if value=\"{{ f.multiline }}\" hint-placeholder-val=\"{{ false }}\">\n              <textarea value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" rows=\"3\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:11px 12px;font-size:15px;resize:vertical\"><\u002Ftextarea>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ f.single }}\" hint-placeholder-val=\"{{ true }}\">\n              <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.ph }}\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:11px 12px;font-size:15px\">\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:22px\">\n          <button sc-camel-on-click=\"{{ rsvpYes }}\" style=\"flex:1;min-width:120px;background:var(--acid);border:none;color:#0a0a0c;padding:14px;font-family:var(--fd);font-size:20px;letter-spacing:1px;cursor:pointer\" style-hover=\"background:var(--ink)\">I'M IN<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ rsvpMaybe }}\" style=\"flex:1;min-width:120px;background:none;border:1px solid var(--line);color:var(--ink);padding:14px;font-family:var(--fd);font-size:20px;letter-spacing:1px;cursor:pointer\" style-hover=\"border-color:var(--violet)\">MAYBE<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ rsvpNo }}\" style=\"flex:1;min-width:120px;background:none;border:1px solid var(--line);color:var(--dim);padding:14px;font-family:var(--fd);font-size:20px;letter-spacing:1px;cursor:pointer\" style-hover=\"border-color:var(--ink);color:var(--ink)\">CAN'T MAKE IT<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--ft);font-size:12px;color:var(--acid);margin-top:14px;min-height:18px\">{{ rsvpMessage }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:70px 32px 0\" id=\"guests\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap\">\n      <div style=\"font-family:var(--fd);font-size:clamp(34px,4.4vw,54px);letter-spacing:1px\">THE GUEST LIST<\u002Fdiv>\n      <div style=\"font-family:var(--ft);font-size:13px;color:var(--dim)\">{{ guestSummary }}<\u002Fdiv>\n      <div style=\"font-family:var(--ft);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--acid)\">{{ syncNote }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:24px\">\n      <sc-for list=\"{{ guestColumns }}\" as=\"col\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid var(--line);background:var(--panel)\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)\">\n            <div style=\"font-family:var(--ft);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--acid)\">{{ col.label }}<\u002Fdiv>\n            <div style=\"font-family:var(--fd);font-size:28px;line-height:1\">{{ col.count }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:8px 0\">\n            <sc-for list=\"{{ col.guests }}\" as=\"g\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;padding:11px 20px;border-bottom:1px solid rgba(44,44,52,0.5)\">\n                <div>\n                  <div style=\"font-size:15px\">{{ g.name }}<\u002Fdiv>\n                  <div style=\"font-family:var(--ft);font-size:11px;color:var(--dim)\">{{ g.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:var(--ft);font-size:12px;color:var(--dim);white-space:nowrap\">{{ g.party }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ col.empty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:18px 20px;font-family:var(--ft);font-size:12px;color:var(--dim)\">Nobody here yet.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:70px 32px 0\" id=\"potluck\">\n    <div style=\"font-family:var(--fd);font-size:clamp(34px,4.4vw,54px);letter-spacing:1px\">POT LUCK<\u002Fdiv>\n    <p style=\"color:var(--dim);font-size:15px;margin:6px 0 24px\">Add whatever you're bringing under the right heading. Everyone sees the list, so check it first and we won't end up with eleven bowls of chips.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n      <sc-for list=\"{{ potluckCategories }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid var(--line);background:var(--panel);padding:20px;display:flex;flex-direction:column\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n            <div style=\"font-family:var(--fd);font-size:26px;letter-spacing:1px\">{{ p.name }}<\u002Fdiv>\n            <div style=\"font-family:var(--ft);font-size:11px;color:var(--acid);white-space:nowrap\">{{ p.status }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--ft);font-size:11px;color:var(--dim);line-height:1.5;margin-top:4px\">{{ p.hint }}<\u002Fdiv>\n          <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:7px;flex:1\">\n            <sc-for list=\"{{ p.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:9px 12px;background:var(--panel2);border-left:2px solid var(--acid)\">\n                <div style=\"font-size:14px\">{{ it.text }}<\u002Fdiv>\n                <div style=\"font-family:var(--ft);font-size:11px;color:var(--dim);white-space:nowrap\">{{ it.by }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ p.empty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding:10px 12px;font-family:var(--ft);font-size:11px;color:var(--dim);border-left:2px solid var(--line)\">Be the first.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px\">\n            <input value=\"{{ p.draftItem }}\" sc-camel-on-change=\"{{ p.onItem }}\" sc-camel-on-key-down=\"{{ p.onKey }}\" placeholder=\"What you're bringing\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px 11px;font-size:14px\">\n            <input value=\"{{ p.draftBy }}\" sc-camel-on-change=\"{{ p.onBy }}\" sc-camel-on-key-down=\"{{ p.onKey }}\" placeholder=\"Your name\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px 11px;font-size:14px\">\n            <button sc-camel-on-click=\"{{ p.add }}\" style=\"background:var(--acid);border:none;color:#0a0a0c;padding:11px;font-family:var(--fd);font-size:18px;letter-spacing:1px;cursor:pointer\" style-hover=\"background:var(--ink)\">ADD IT<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:70px 32px 0\" id=\"costumes\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap\">\n      <div style=\"font-family:var(--fd);font-size:clamp(34px,4.4vw,54px);letter-spacing:1px\">COSTUME IDEAS<\u002Fdiv>\n      <div style=\"font-family:var(--ft);font-size:13px;color:var(--dim)\">{{ costumeHint }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px;margin-top:24px\">\n      <sc-for list=\"{{ costumes }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid var(--line);background:var(--panel)\">\n          <div style=\"aspect-ratio:3/4;position:relative;overflow:hidden;background:var(--panel2);display:flex;align-items:flex-end;padding:14px\">\n            <sc-if value=\"{{ c.hasImage }}\" hint-placeholder-val=\"{{ false }}\">\n              <img ref=\"{{ c.imgRef }}\" alt=\"{{ c.name }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n            <\u002Fsc-if>\n            <sc-if value=\"{{ c.noImage }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(242,239,228,0.05) 0 8px,transparent 8px 16px)\"><\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"position:relative;font-family:var(--ft);font-size:10px;letter-spacing:1px;color:var(--dim);background:rgba(10,10,12,0.72);padding:5px 8px\">{{ c.slotLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px 16px 18px\">\n            <div style=\"font-family:var(--fd);font-size:22px;letter-spacing:1px\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--dim);line-height:1.5;margin-top:5px\">{{ c.desc }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:70px 32px 0\" id=\"photos\">\n    <div style=\"display:flex;align-items:baseline;gap:20px;flex-wrap:wrap\">\n      <div style=\"font-family:var(--fd);font-size:clamp(34px,4.4vw,54px);letter-spacing:1px\">PHOTOS<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ photoYears }}\" as=\"y\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ y.select }}\" style=\"background:{{ y.bg }};border:1px solid var(--line);color:{{ y.color }};padding:7px 14px;font-family:var(--ft);font-size:12px;letter-spacing:1px;cursor:pointer\">{{ y.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <label style=\"display:block;margin-top:22px;border:1px dashed var(--line);padding:26px;text-align:center;cursor:pointer;font-family:var(--ft);font-size:12px;letter-spacing:1px;color:var(--dim)\" style-hover=\"border-color:var(--acid);color:var(--acid)\">\n      Drop or choose photos to add to {{ activeYear }}\n      <input type=\"file\" accept=\"image/*\" multiple=\"\" sc-camel-on-change=\"{{ onPhotoUpload }}\" style=\"display:none\">\n    <\u002Flabel>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px\">\n      <sc-for list=\"{{ activePhotos }}\" as=\"ph\" hint-placeholder-count=\"6\">\n        <div style=\"position:relative;aspect-ratio:4/3;background:var(--panel2);border:1px solid var(--line);overflow:hidden\">\n          <sc-if value=\"{{ ph.hasImage }}\" hint-placeholder-val=\"{{ false }}\">\n            <img ref=\"{{ ph.imgRef }}\" alt=\"{{ ph.caption }}\" style=\"width:100%;height:100%;object-fit:cover\">\n          <\u002Fsc-if>\n          <sc-if value=\"{{ ph.noImage }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(242,239,228,0.05) 0 8px,transparent 8px 16px)\"><\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"position:absolute;left:0;right:0;bottom:0;padding:7px 10px;background:rgba(10,10,12,0.74);font-family:var(--ft);font-size:10px;letter-spacing:1px;color:var(--dim)\">{{ ph.caption }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:70px 32px 0\" id=\"music\">\n    <div style=\"font-family:var(--fd);font-size:clamp(34px,4.4vw,54px);letter-spacing:1px\">LEARNING TRACKS<\u002Fdiv>\n    <p style=\"color:var(--dim);font-size:15px;margin:6px 0 24px;max-width:60ch\">Two songs for the sing-along. Pick your part, play it here, or download the file and practice in the car. Sheet music is on each card.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <sc-for list=\"{{ songs }}\" as=\"sg\" hint-placeholder-count=\"2\">\n        <div style=\"border:1px solid var(--line);background:var(--panel)\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:24px 26px;border-bottom:1px solid var(--line)\">\n            <div>\n              <div style=\"font-family:var(--fd);font-size:clamp(28px,3.4vw,42px);letter-spacing:1px;line-height:1\">{{ sg.title }}<\u002Fdiv>\n              <div style=\"font-family:var(--ft);font-size:12px;color:var(--dim);margin-top:6px\">{{ sg.note }}<\u002Fdiv>\n            <\u002Fdiv>\n            <a href=\"{{ sg.sheetFile }}\" download=\"\" style=\"border:1px solid var(--line);color:var(--ink);padding:11px 16px;font-family:var(--ft);font-size:11px;letter-spacing:1px;white-space:nowrap\" style-hover=\"border-color:var(--acid);color:var(--acid)\">{{ sg.sheetLabel }}<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;padding:18px 26px 0\">\n            <sc-for list=\"{{ sg.partButtons }}\" as=\"pb\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ pb.select }}\" style=\"background:{{ pb.bg }};border:1px solid var(--line);color:{{ pb.color }};padding:9px 16px;font-family:var(--ft);font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer\" style-hover=\"border-color:var(--acid)\">{{ pb.name }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:18px 26px 26px\">\n            <sc-for list=\"{{ sg.parts }}\" as=\"pt\" hint-placeholder-count=\"1\">\n              <div style=\"display:{{ pt.display }};flex-direction:column;gap:12px\">\n                <sc-for list=\"{{ pt.tracks }}\" as=\"tr\" hint-placeholder-count=\"3\">\n                  <div style=\"background:var(--panel2);padding:14px 16px\">\n                    <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px\">\n                      <div style=\"font-size:15px\">{{ tr.label }}<\u002Fdiv>\n                      <a href=\"{{ tr.file }}\" download=\"\" style=\"font-family:var(--ft);font-size:11px;letter-spacing:1px;white-space:nowrap\">DOWNLOAD<\u002Fa>\n                    <\u002Fdiv>\n                    <audio controls=\"\" preload=\"none\" ref=\"{{ tr.audioRef }}\" style=\"width:100%;height:36px\"><\u002Faudio>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:70px 32px 0\" id=\"schedule\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px\">\n      <div>\n        <div style=\"font-family:var(--fd);font-size:clamp(34px,4.4vw,54px);letter-spacing:1px\">THE NIGHT<\u002Fdiv>\n        <div style=\"margin-top:20px;border-left:1px solid var(--line);padding-left:22px;display:flex;flex-direction:column;gap:20px\">\n          <sc-for list=\"{{ schedule }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"position:relative\">\n              <div style=\"position:absolute;left:-27px;top:7px;width:9px;height:9px;background:var(--acid)\"><\u002Fdiv>\n              <div style=\"font-family:var(--ft);font-size:12px;letter-spacing:2px;color:var(--acid)\">{{ s.time }}<\u002Fdiv>\n              <div style=\"font-family:var(--fd);font-size:24px;letter-spacing:1px;margin-top:2px\">{{ s.what }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:var(--dim);line-height:1.5\">{{ s.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"directions\">\n        <div style=\"font-family:var(--fd);font-size:clamp(34px,4.4vw,54px);letter-spacing:1px\">GETTING THERE<\u002Fdiv>\n        <div style=\"border:1px solid var(--line);background:var(--panel);padding:24px;margin-top:20px\">\n          <div style=\"font-family:var(--ft);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acid)\">Address<\u002Fdiv>\n          <div style=\"font-size:19px;line-height:1.5;margin-top:6px\">{{ eventAddress }}<\u002Fdiv>\n          <a href=\"{{ mapsUrl }}\" target=\"_blank\" style=\"display:inline-block;margin-top:12px;font-family:var(--ft);font-size:12px;letter-spacing:1px\">OPEN IN MAPS →<\u002Fa>\n          <div style=\"height:1px;background:var(--line);margin:22px 0\"><\u002Fdiv>\n          <div style=\"font-family:var(--ft);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acid)\">Parking<\u002Fdiv>\n          <p style=\"font-size:15px;color:var(--dim);line-height:1.6;margin:6px 0 0;white-space:pre-wrap\">{{ parkingNote }}<\u002Fp>\n          <div style=\"height:1px;background:var(--line);margin:22px 0\"><\u002Fdiv>\n          <div style=\"font-family:var(--ft);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acid)\">Lost? Call Bryan<\u002Fdiv>\n          <div style=\"font-family:var(--fd);font-size:32px;letter-spacing:2px;margin-top:4px\">{{ hostPhone }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:70px 32px 0\" id=\"social\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n      <div style=\"border:1px solid var(--line);background:var(--panel);padding:26px\">\n        <div style=\"font-family:var(--fd);font-size:30px;letter-spacing:1px\">FOLLOW THE CHAOS<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:16px\">\n          <sc-for list=\"{{ socials }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <a href=\"{{ s.url }}\" target=\"_blank\" style=\"display:flex;justify-content:space-between;padding:12px 14px;background:var(--panel2);color:var(--ink)\" style-hover=\"color:var(--acid)\">\n              <span style=\"font-family:var(--ft);font-size:12px;letter-spacing:2px;text-transform:uppercase\">{{ s.network }}<\u002Fspan>\n              <span style=\"font-size:14px;color:var(--dim)\">{{ s.handle }}<\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--ft);font-size:11px;color:var(--line);margin-top:16px\">Live feed embeds drop in here once the accounts are connected.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--line);background:var(--panel);padding:26px\">\n        <div style=\"font-family:var(--fd);font-size:30px;letter-spacing:1px\">PARTY UPDATES<\u002Fdiv>\n        <p style=\"font-size:15px;color:var(--dim);line-height:1.6\">Menu changes, contest rules, and the after-party photo drop. Leave your email and Bryan will keep you posted.<\u002Fp>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:8px\">\n          <input value=\"{{ newsEmail }}\" sc-camel-on-change=\"{{ onNewsEmail }}\" placeholder=\"you@email.com\" style=\"flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:13px 12px;font-size:15px\">\n          <button sc-camel-on-click=\"{{ subscribe }}\" style=\"background:var(--acid);border:none;color:#0a0a0c;padding:13px 22px;font-family:var(--fd);font-size:19px;letter-spacing:1px;cursor:pointer\" style-hover=\"background:var(--ink)\">SIGN ME UP<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--ft);font-size:12px;color:var(--acid);margin-top:12px;min-height:18px\">{{ newsMessage }}<\u002Fdiv>\n        <a href=\"{{ hostMailto }}\" style=\"font-family:var(--ft);font-size:11px;letter-spacing:1px\">QUESTIONS? EMAIL BRYAN →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:70px 32px 80px\">\n    <div style=\"border-top:1px solid var(--line);padding-top:26px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-family:var(--ft);font-size:12px;color:var(--dim)\">\n      <div>{{ eventTitle }} · {{ eventDate }}<\u002Fdiv>\n      <div>{{ siteDomain }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:relative;overflow:hidden;min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:60px 24px\">\n  <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--stripe) 0 30px,transparent 30px 60px);opacity:0.06\"><\u002Fdiv>\n  <div style=\"position:relative;width:100%;max-width:960px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)\">\n    <div style=\"background:var(--panel);padding:40px 36px\">\n      <div style=\"font-family:var(--ft);font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--acid)\">You found the invite<\u002Fdiv>\n      <div style=\"font-family:var(--fd);font-size:clamp(42px,7vw,80px);line-height:0.88;letter-spacing:2px;margin-top:18px\">{{ eventTitle }}<\u002Fdiv>\n      <div style=\"font-family:var(--ft);font-size:15px;margin-top:20px;line-height:1.8\">\n        <div>{{ eventDate }} · {{ eventTime }}<\u002Fdiv>\n        <div>{{ eventAddress }}<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:15px;color:var(--dim);line-height:1.6;margin-top:22px\">Requests are reviewed by the host. Bryan will get back to you with the full details and the potluck list.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:24px\">\n        <sc-for list=\"{{ requestFields }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.ph }}\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:13px 12px;font-size:15px\">\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ submitRequest }}\" style=\"background:var(--acid);border:none;color:#0a0a0c;padding:15px;font-family:var(--fd);font-size:22px;letter-spacing:2px;cursor:pointer\" style-hover=\"background:var(--ink)\">REQUEST AN INVITE<\u002Fbutton>\n        <div style=\"font-family:var(--ft);font-size:12px;color:var(--acid);min-height:18px\">{{ requestMessage }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel2);padding:40px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center\">\n      <div style=\"font-family:var(--ft);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)\">Scan to open this page<\u002Fdiv>\n      <div style=\"padding:16px;background:var(--ink);animation:sway 9s ease-in-out infinite\">\n        <canvas ref=\"{{ qrRef }}\" width=\"220\" height=\"220\" style=\"display:block;width:220px;height:220px\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--fd);font-size:26px;letter-spacing:2px\">{{ siteDomain }}<\u002Fdiv>\n      <div style=\"font-family:var(--ft);font-size:12px;color:var(--dim);max-width:26ch\">Print it on the flier, text it, tape it to the punch bowl.<\u002Fdiv>\n      <sc-if value=\"{{ qrReady }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"{{ qrDownload }}\" download=\"party-qr.png\" style=\"font-family:var(--ft);font-size:11px;letter-spacing:1px\">DOWNLOAD QR PNG<\u002Fa>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ adminOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:60;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-30px 0 60px rgba(0,0,0,0.5)\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)\">\n    <div style=\"font-family:var(--fd);font-size:24px;letter-spacing:2px\">SITE EDITOR<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleAdmin }}\" style=\"background:none;border:1px solid var(--line);color:var(--dim);width:32px;height:32px;cursor:pointer;font-size:16px\">×<\u002Fbutton>\n  <\u002Fdiv>\n  <sc-if value=\"{{ adminLocked }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:26px 20px\">\n      <div style=\"font-family:var(--ft);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acid)\">Host sign-in<\u002Fdiv>\n      <p style=\"font-size:14px;color:var(--dim);line-height:1.6;margin:10px 0 18px\">The editor is for the host. Everything else on the site stays open to guests.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <input value=\"{{ loginUser }}\" sc-camel-on-change=\"{{ onLoginUser }}\" placeholder=\"Username\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:12px;font-size:15px\">\n        <input type=\"password\" value=\"{{ loginPass }}\" sc-camel-on-change=\"{{ onLoginPass }}\" sc-camel-on-key-down=\"{{ onLoginKey }}\" placeholder=\"Password\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:12px;font-size:15px\">\n        <button sc-camel-on-click=\"{{ submitLogin }}\" style=\"background:var(--acid);border:none;color:#0a0a0c;padding:14px;font-family:var(--fd);font-size:20px;letter-spacing:1px;cursor:pointer\" style-hover=\"background:var(--ink)\">UNLOCK EDITOR<\u002Fbutton>\n        <div style=\"font-family:var(--ft);font-size:12px;color:var(--violet);min-height:18px\">{{ loginMessage }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ adminAuthed }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;gap:6px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)\">\n    <sc-for list=\"{{ adminTabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n      <button sc-camel-on-click=\"{{ t.select }}\" style=\"background:{{ t.bg }};border:1px solid var(--line);color:{{ t.color }};padding:6px 11px;font-family:var(--ft);font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow-y:auto;padding:20px\">\n    <div style=\"font-family:var(--ft);font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:16px\">{{ adminHint }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <sc-for list=\"{{ adminFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div>\n          <label style=\"display:block;font-family:var(--ft);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:5px\">{{ f.label }}<\u002Flabel>\n          <sc-if value=\"{{ f.isText }}\" hint-placeholder-val=\"{{ true }}\">\n            <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px 11px;font-size:14px\">\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n            <textarea value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" rows=\"{{ f.rows }}\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px 11px;font-size:14px;resize:vertical;line-height:1.5\"><\u002Ftextarea>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isColor }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:8px;align-items:center\">\n              <input type=\"color\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"width:46px;height:34px;background:none;border:1px solid var(--line);padding:2px;cursor:pointer\">\n              <span style=\"font-family:var(--ft);font-size:12px;color:var(--dim)\">{{ f.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isSelect }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-raw-select value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px 11px;font-size:14px\">\n              <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"2\">\n                <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fsc-if>\n          <div style=\"font-family:var(--ft);font-size:10px;color:var(--line);margin-top:4px\">{{ f.help }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showGuestEditor }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:20px;border:1px solid var(--line);background:var(--panel2);padding:16px\">\n        <div style=\"font-family:var(--ft);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acid)\">Import guests<\u002Fdiv>\n        <div style=\"font-family:var(--ft);font-size:10px;color:var(--dim);line-height:1.6;margin:8px 0 10px\">One guest per line: name, email, party size, status. Commas or tabs both work, a header row is fine, and only the name is required. Status accepts coming / not / pending.<\u002Fdiv>\n        <textarea value=\"{{ importText }}\" sc-camel-on-change=\"{{ onImportText }}\" rows=\"5\" placeholder=\"Priya Rao, priya@email.com, 2, pending\nMarcus Webb, marcus@email.com, 1, coming\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px 11px;font-size:13px;font-family:var(--ft);resize:vertical\"><\u002Ftextarea>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:10px\">\n          <label style=\"flex:1;min-width:130px;text-align:center;border:1px dashed var(--line);color:var(--dim);padding:10px;font-family:var(--ft);font-size:11px;letter-spacing:1px;cursor:pointer\" style-hover=\"border-color:var(--acid);color:var(--acid)\">\n            LOAD CSV FILE\n            <input type=\"file\" accept=\".csv,.txt,text/csv\" sc-camel-on-change=\"{{ onImportFile }}\" style=\"display:none\">\n          <\u002Flabel>\n          <button sc-camel-on-click=\"{{ runImportMerge }}\" style=\"flex:1;min-width:130px;background:var(--acid);border:none;color:#0a0a0c;padding:11px;font-family:var(--ft);font-size:11px;letter-spacing:1px;font-weight:700;cursor:pointer\">ADD / UPDATE<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ runImportReplace }}\" style=\"flex:1;min-width:130px;background:none;border:1px solid var(--line);color:var(--dim);padding:11px;font-family:var(--ft);font-size:11px;letter-spacing:1px;cursor:pointer\" style-hover=\"border-color:var(--ink);color:var(--ink)\">REPLACE LIST<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--ft);font-size:11px;color:var(--acid);margin-top:10px;min-height:16px\">{{ importMessage }}<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:6px\">\n          <button sc-camel-on-click=\"{{ exportGuestCsv }}\" style=\"background:none;border:1px solid var(--line);color:var(--dim);padding:9px 13px;font-family:var(--ft);font-size:11px;letter-spacing:1px;cursor:pointer\" style-hover=\"border-color:var(--acid);color:var(--acid)\">EXPORT CSV<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ copyEmails }}\" style=\"background:none;border:1px solid var(--line);color:var(--dim);padding:9px 13px;font-family:var(--ft);font-size:11px;letter-spacing:1px;cursor:pointer\" style-hover=\"border-color:var(--acid);color:var(--acid)\">{{ copyEmailsLabel }}<\u002Fbutton>\n          <a href=\"{{ mailAllUrl }}\" style=\"border:1px solid var(--line);color:var(--dim);padding:9px 13px;font-family:var(--ft);font-size:11px;letter-spacing:1px\" style-hover=\"border-color:var(--acid);color:var(--acid)\">OPEN GMAIL TO ALL<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:24px\">\n        <div style=\"font-family:var(--ft);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acid);margin-bottom:10px\">Invite list<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ allGuests }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:8px;align-items:center;background:var(--panel2);padding:9px 11px;flex-wrap:wrap\">\n              <input value=\"{{ g.name }}\" sc-camel-on-change=\"{{ g.onName }}\" style=\"flex:1;min-width:110px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;font-size:13px\">\n              <input value=\"{{ g.email }}\" sc-camel-on-change=\"{{ g.onEmail }}\" placeholder=\"email\" style=\"flex:1;min-width:130px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;font-size:13px;font-family:var(--ft)\">\n              <sc-raw-select value=\"{{ g.status }}\" sc-camel-on-change=\"{{ g.onStatus }}\" style=\"background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 6px;font-size:12px\">\n                <option value=\"coming\">Coming<\u002Foption>\n                <option value=\"not\">Not coming<\u002Foption>\n                <option value=\"pending\">No reply<\u002Foption>\n              <\u002Fsc-raw-select>\n              <button sc-camel-on-click=\"{{ g.remove }}\" style=\"background:none;border:1px solid var(--line);color:var(--dim);width:28px;height:30px;cursor:pointer\">×<\u002Fbutton>\n              <sc-if value=\"{{ g.fromSheet }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex-basis:100%;font-family:var(--ft);font-size:10px;letter-spacing:1px;color:var(--acid)\">REPLIED THROUGH THE SITE — EDITS SAVE TO YOUR SHEET<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ addGuest }}\" style=\"margin-top:10px;background:none;border:1px dashed var(--line);color:var(--acid);padding:10px;width:100%;font-family:var(--ft);font-size:11px;letter-spacing:1px;cursor:pointer\">+ Add guest<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ showListEditor }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:24px\">\n        <div style=\"font-family:var(--ft);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acid);margin-bottom:10px\">{{ listEditorLabel }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ listRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"background:var(--panel2);padding:11px;display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <input value=\"{{ c.value }}\" sc-camel-on-change=\"{{ c.onChange }}\" placeholder=\"{{ c.ph }}\" style=\"width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 9px;font-size:13px\">\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ r.remove }}\" style=\"align-self:flex-end;background:none;border:1px solid var(--line);color:var(--dim);padding:5px 10px;font-family:var(--ft);font-size:10px;letter-spacing:1px;cursor:pointer\">REMOVE<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ addListRow }}\" style=\"margin-top:10px;background:none;border:1px dashed var(--line);color:var(--acid);padding:10px;width:100%;font-family:var(--ft);font-size:11px;letter-spacing:1px;cursor:pointer\">{{ addRowLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"margin-top:28px;border-top:1px solid var(--line);padding-top:16px;display:flex;gap:8px;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ exportData }}\" style=\"background:none;border:1px solid var(--line);color:var(--ink);padding:9px 13px;font-family:var(--ft);font-size:11px;letter-spacing:1px;cursor:pointer\">EXPORT JSON<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ resetData }}\" style=\"background:none;border:1px solid var(--line);color:var(--dim);padding:9px 13px;font-family:var(--ft);font-size:11px;letter-spacing:1px;cursor:pointer\">RESET TO DEFAULTS<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ signOut }}\" style=\"background:none;border:1px solid var(--line);color:var(--dim);padding:9px 13px;font-family:var(--ft);font-size:11px;letter-spacing:1px;cursor:pointer\">SIGN OUT<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;themePreset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;halloween&quot;,&quot;christmas&quot;],&quot;default&quot;:&quot;halloween&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;site&quot;,&quot;landing&quot;],&quot;default&quot;:&quot;site&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;spookyMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;backgroundFade&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;backgroundSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:7,&quot;min&quot;:3,&quot;max&quot;:20,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;}}\">\nconst THEMES = {\n  halloween: {\n    label: 'Halloween — Spiral & Stripe',\n    vars: { '--bg':'#0a0a0c','--panel':'#121216','--panel2':'#191920','--ink':'#f2efe4','--dim':'#a09c90','--line':'#2c2c34','--acid':'oklch(0.84 0.19 132)','--violet':'oklch(0.64 0.15 300)','--stripe':'#f2efe4' }\n  },\n  christmas: {\n    label: 'Christmas — Fir & Ember',\n    vars: { '--bg':'#0b1210','--panel':'#111c18','--panel2':'#16241f','--ink':'#f4efe6','--dim':'#9aa79e','--line':'#26362f','--acid':'oklch(0.78 0.15 42)','--violet':'oklch(0.62 0.13 160)','--stripe':'#f4efe6' }\n  }\n};\n\nconst DEFAULTS = () => ({\n  themeKey: 'halloween',\n  accent: '',\n  event: {\n    title: 'SANDBERG HALLOWEEN PARTY',\n    shortTitle: 'SANDBERG HALLOWEEN',\n    kicker: 'A Nightmare Before Christmas × Beetlejuice mash-up',\n    date: 'Saturday, October 24, 2026',\n    time: '6:30 PM until the ghosts get bored',\n    address: '21638 Long Trot Drive, Escondido, CA 92029',\n    phone: '714-342-8484',\n    domain: 'sandberghalloween.com',\n    email: 'sandberghalloween@gmail.com',\n    parking: 'Park along Long Trot Drive, both sides. Please leave the driveway and the neighbors\\u2019 mailboxes clear. Overflow parking is at the top of the cul-de-sac.'\n  },\n  hostNote: 'Doors open at 7. Costumes strongly encouraged, mediocre costumes gently mocked. There is a contest, there are prizes, and yes, the host is competing.\\n\\nUse this space for anything that changes between now and the party \\u2014 menu updates, weather calls, who\\u2019s bringing the fog machine.',\n  contestNote: 'Judging at 9:30 in the living room. Say your name twice, not three times.',\n  contestCategories: [\n    { name: 'Best Overall', prize: 'Grand prize' },\n    { name: 'Best Mash-Up', prize: 'Two movies, one costume' },\n    { name: 'Best Group', prize: 'Three or more' }\n  ],\n  costumeHint: 'Drop your own reference photos into any slot below.',\n  costumes: [\n    { name: 'The Striped Suit', desc: 'Black-and-white pinstripes, wild pale hair, dirt under the nails. Loud on purpose.', image: '' },\n    { name: 'The Pinstripe Skeleton', desc: 'Tailcoat, bat bow tie, chalk-white face. Tall and polite about it.', image: '' },\n    { name: 'The Stitched Ragdoll', desc: 'Patchwork dress, visible seams, yarn hair. Bring a needle for repairs.', image: '' },\n    { name: 'Recently Deceased Newlyweds', desc: 'Sensible sweaters, a sheet, and increasingly bad ideas.', image: '' },\n    { name: 'The Red Wedding Dress', desc: 'Crimson gown, black veil, look of deep regret.', image: '' },\n    { name: 'Trick-or-Treat Trio', desc: 'Masks, a rolling tub, no supervision. Best as a group.', image: '' }\n  ],\n  guests: [\n    { name: 'Bryan & Tracey Sandberg', status: 'coming', party: 2, note: 'Hosts', dish: 'Smoked tri-tip', email: '' }\n  ],\n  potluck: [\n    { name: 'Mains', hint: 'Something substantial \\u2014 a tray, a pot, a platter' },\n    { name: 'Sides', hint: 'Salads, bread, corn, anything alongside' },\n    { name: 'Desserts', hint: 'Sweets, cookies, something on a stick' },\n    { name: 'Drinks & Ice', hint: 'Cider, soda, sparkling water, bags of ice' }\n  ],\n  photoYears: [\n    { year: '2026', photos: [] },\n    { year: '2025', photos: [ {src:'',caption:'costume contest lineup'}, {src:'',caption:'the fog machine incident'}, {src:'',caption:'backyard, 11pm'} ] },\n    { year: '2024', photos: [ {src:'',caption:'front porch setup'}, {src:'',caption:'group shot'} ] }\n  ],\n  songs: [\n    {\n      title: 'Grim Grinning Ghosts',\n      note: 'Four parts, learning tracks for each voice.',\n      sheet: { file: 'media/music/ggg-sheet.docx', label: 'SHEET MUSIC (WORD)' },\n      parts: [\n        { name: 'Full mix', tracks: [ { label: 'All four parts, balanced', file: 'media/music/ggg-full.mp3' } ] },\n        { name: 'Tenor', tracks: [\n          { label: 'Tenor predominant', file: 'media/music/ggg-tenor-pred.mp3' },\n          { label: 'Tenor in the left ear', file: 'media/music/ggg-tenor-left.mp3' },\n          { label: 'Sing along \\u2014 no tenor', file: 'media/music/ggg-no-tenor.mp3' } ] },\n        { name: 'Lead', tracks: [\n          { label: 'Lead predominant', file: 'media/music/ggg-lead-pred.mp3' },\n          { label: 'Lead in the left ear', file: 'media/music/ggg-lead-left.mp3' },\n          { label: 'Sing along \\u2014 no lead', file: 'media/music/ggg-no-lead.mp3' } ] },\n        { name: 'Baritone', tracks: [\n          { label: 'Baritone predominant', file: 'media/music/ggg-bari-pred.mp3' },\n          { label: 'Baritone in the left ear', file: 'media/music/ggg-bari-left.mp3' },\n          { label: 'Sing along \\u2014 no baritone', file: 'media/music/ggg-no-bari.mp3' } ] },\n        { name: 'Bass', tracks: [\n          { label: 'Bass predominant', file: 'media/music/ggg-bass-pred.mp3' },\n          { label: 'Bass in the left ear', file: 'media/music/ggg-bass-left.mp3' },\n          { label: 'Sing along \\u2014 no bass', file: 'media/music/ggg-no-bass.mp3' } ] }\n      ]\n    },\n    {\n      title: 'Spooky Scary Skeletons',\n      note: 'One track per part, plus the balanced mix.',\n      sheet: { file: 'media/music/sss-sheet.pdf', label: 'SHEET MUSIC (PDF)' },\n      parts: [\n        { name: 'Full mix', tracks: [ { label: 'All four parts, balanced', file: 'media/music/sss-balanced.mp3' } ] },\n        { name: 'Tenor', tracks: [ { label: 'Tenor', file: 'media/music/sss-tenor.mp3' } ] },\n        { name: 'Lead', tracks: [ { label: 'Lead', file: 'media/music/sss-lead.mp3' } ] },\n        { name: 'Baritone', tracks: [ { label: 'Baritone', file: 'media/music/sss-bari.mp3' } ] },\n        { name: 'Bass', tracks: [ { label: 'Bass', file: 'media/music/sss-bass.mp3' } ] }\n      ]\n    }\n  ],\n  schedule: [\n    { time: '6:30 PM', what: 'Doors open', note: 'Drop your dish in the kitchen, grab a drink.' },\n    { time: '8:00 PM', what: 'Sing-along', note: 'Learning tracks are on this site. No excuses.' },\n    { time: '9:30 PM', what: 'Costume contest', note: 'Judging in the living room.' },\n    { time: '10:30 PM', what: 'Backyard & fire pit', note: 'Quieter, warmer, better conversation.' }\n  ],\n  socials: [\n    { network: 'Instagram', handle: '@sandbergparty', url: '#' },\n    { network: 'Facebook', handle: 'Sandberg Halloween', url: '#' },\n    { network: 'YouTube', handle: 'Sandberg Sing-Along', url: '#' }\n  ]\n});\n\nconst KEY = 'sandberg-party-site-v3';\n\nconst ENDPOINT = 'https://script.google.com/macros/s/AKfycbwPp4Vgh9UVEZM4vT2M3YNRI5NbQK8zGXuALAR7QzuDZ8QwxPwcmF0EjSgGVN-c6OJvew/exec';\n\nfunction postToSheet(payload) {\n  if (!ENDPOINT) return;\n  try {\n    fetch(ENDPOINT, {\n      method: 'POST',\n      mode: 'no-cors',\n      headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n      body: JSON.stringify(payload)\n    });\n  } catch (e) {}\n}\n\nconst BG_IMAGES = [\n  'media/bg-01.jpg','media/bg-02.jpg','media/bg-03.jpg','media/bg-04.jpg','media/bg-05.jpg',\n  'media/bg-06.jpg','media/bg-07.jpg','media/bg-08.jpg','media/bg-09.jpg','media/bg-10.jpg',\n  'media/bg-11.jpg','media/bg-12.jpg','media/bg-13.jpg'\n];\n\nclass Component extends DCLogic {\n  state = {\n    data: null,\n    view: 'site',\n    adminOpen: false,\n    adminTab: 'Event',\n    activeYear: '2026',\n    rsvp: { name:'', email:'', party:'', dish:'', message:'' },\n    rsvpMessage: '',\n    request: { name:'', email:'', party:'', note:'' },\n    requestMessage: '',\n    newsEmail: '',\n    newsMessage: '',\n    now: Date.now(),\n    qrDownload: '#',\n    authed: false,\n    login: { user: '', pass: '' },\n    loginMessage: '',\n    send: null,\n    sendCopied: false,\n    remote: { rsvps: [], potluck: [] },\n    syncState: 'loading'\n  };\n\n  addPotluck(cat, draft) {\n    const item = (draft.item || '').trim();\n    const by = (draft.by || '').trim();\n    if (!item) return;\n    postToSheet({ kind: 'potluck', category: cat, item, by });\n    this.setState(st => ({\n      remote: { rsvps: st.remote.rsvps, potluck: st.remote.potluck.concat([{ Category: cat, Item: item, ClaimedBy: by }]) },\n      potluckDraft: Object.assign({}, st.potluckDraft, { [cat]: { item: '', by: '' } })\n    }));\n    setTimeout(() => this.fetchRemote(), 2500);\n  }\n\n  fetchRemote() {\n    if (!ENDPOINT) { this.setState({ syncState: 'off' }); return; }\n    fetch(ENDPOINT + '?t=' + Date.now())\n      .then(r => r.json())\n      .then(j => this.setState({\n        remote: { rsvps: (j && j.rsvps) || [], potluck: (j && j.potluck) || [] },\n        syncState: 'live'\n      }))\n      .catch(() => this.setState({ syncState: 'error' }));\n  }\n\n  openSend(title, subject, body) {\n    this.setState({ send: { title, subject, body }, sendCopied: false });\n  }\n\n  componentDidMount() {\n    let data = null;\n    try { const raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); } catch (e) {}\n    if (!data) data = DEFAULTS();\n    if (this.props.themePreset && THEMES[this.props.themePreset]) data.themeKey = this.props.themePreset;\n    if (this.props.spookyMotion === false) {\n      const st = document.createElement('style');\n      st.textContent = '*{animation:none !important}';\n      document.head.appendChild(st);\n    }\n    this.setState({ data, view: this.props.startView === 'landing' ? 'landing' : 'site' }, () => { this.applyTheme(); this.drawQR(); });\n    this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);\n    this.qrRef = React.createRef();\n    this.startBackground();\n    this.fetchRemote();\n    this.syncTimer = setInterval(() => this.fetchRemote(), 30000);\n    try { if (sessionStorage.getItem('sandberg-admin') === '1') this.setState({ authed: true }); } catch (e) {}\n  }\n\n  tryLogin() {\n    const { user, pass } = this.state.login;\n    let expected = '';\n    try { expected = atob('ITFNMHU1M3IxIQ=='); } catch (e) {}\n    if (user.trim().toLowerCase() === 'mohsandy' && pass === expected) {\n      try { sessionStorage.setItem('sandberg-admin', '1'); } catch (e) {}\n      this.setState({ authed: true, loginMessage: '', login: { user: '', pass: '' } });\n    } else {\n      this.setState({ loginMessage: 'Wrong username or password.' });\n    }\n  }\n  componentWillUnmount() { clearInterval(this.timer); clearInterval(this.bgTimer); clearInterval(this.syncTimer); }\n\n  startBackground() {\n    if (this.props.backgroundFade === false) return;\n    const hold = (Number(this.props.backgroundSeconds) || 7) * 1000;\n    let i = 0, showA = true;\n    BG_IMAGES.forEach(src => { const im = new Image(); im.src = src; });\n    const step = () => {\n      const a = this.bgA, b = this.bgB;\n      if (!a || !b) return;\n      const incoming = showA ? a : b, outgoing = showA ? b : a;\n      incoming.src = BG_IMAGES[i % BG_IMAGES.length];\n      incoming.style.opacity = '1';\n      outgoing.style.opacity = '0';\n      i++; showA = !showA;\n    };\n    setTimeout(step, 120);\n    this.bgTimer = setInterval(step, hold);\n  }\n\n\n  save(mutator) {\n    this.setState(s => {\n      const data = JSON.parse(JSON.stringify(s.data));\n      mutator(data);\n      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}\n      return { data };\n    }, () => this.applyTheme());\n  }\n\n  applyTheme() {\n    const d = this.state.data; if (!d) return;\n    const t = THEMES[d.themeKey] || THEMES.halloween;\n    const root = document.documentElement;\n    Object.keys(t.vars).forEach(k => root.style.setProperty(k, t.vars[k]));\n    if (d.accent) root.style.setProperty('--acid', d.accent);\n  }\n\n  qrMatrix(text) {\n    const data = [];\n    const utf = unescape(encodeURIComponent(text));\n    for (let i = 0; i < utf.length; i++) data.push(utf.charCodeAt(i) & 0xff);\n    const CAP = [17, 32, 53, 78, 106, 134];\n    const SPEC = [[26,7,1],[44,10,1],[70,15,1],[100,20,1],[134,26,1],[172,18,2]];\n    if (data.length > CAP[5]) return null;\n    let v = 0; while (v < 5 && data.length > CAP[v]) v++;\n    const version = v + 1, total = SPEC[v][0], ecLen = SPEC[v][1], blocks = SPEC[v][2];\n    const dataCw = total - ecLen * blocks;\n\n    const bits = [];\n    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };\n    push(4, 4); push(data.length, 8);\n    data.forEach(b => push(b, 8));\n    const cap = dataCw * 8;\n    for (let i = 0; i < 4 && bits.length < cap; i++) bits.push(0);\n    while (bits.length % 8) bits.push(0);\n    const cws = [];\n    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; cws.push(b); }\n    const pad = [0xEC, 0x11]; let pi = 0;\n    while (cws.length < dataCw) cws.push(pad[pi++ % 2]);\n\n    const exp = new Array(512), log = new Array(256);\n    let x = 1;\n    for (let i = 0; i < 255; i++) { exp[i] = x; log[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }\n    for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];\n    const mul = (a, b) => (a === 0 || b === 0) ? 0 : exp[log[a] + log[b]];\n\n    let gen = [1];\n    for (let i = 0; i < ecLen; i++) {\n      const ng = new Array(gen.length + 1).fill(0);\n      for (let j = 0; j < gen.length; j++) { ng[j] ^= gen[j]; ng[j + 1] ^= mul(gen[j], exp[i]); }\n      gen = ng;\n    }\n\n    const perBlock = dataCw / blocks, dataBlocks = [], ecBlocks = [];\n    for (let b = 0; b < blocks; b++) {\n      const blk = cws.slice(b * perBlock, (b + 1) * perBlock);\n      dataBlocks.push(blk);\n      const rem = new Array(ecLen).fill(0);\n      blk.forEach(byte => {\n        const factor = byte ^ rem[0];\n        rem.shift(); rem.push(0);\n        for (let i = 0; i < ecLen; i++) rem[i] ^= mul(gen[i + 1], factor);\n      });\n      ecBlocks.push(rem);\n    }\n    const final = [];\n    for (let i = 0; i < perBlock; i++) for (let b = 0; b < blocks; b++) final.push(dataBlocks[b][i]);\n    for (let i = 0; i < ecLen; i++) for (let b = 0; b < blocks; b++) final.push(ecBlocks[b][i]);\n\n    const size = 17 + 4 * version, m = [], fn = [];\n    for (let r = 0; r < size; r++) { m.push(new Array(size).fill(0)); fn.push(new Array(size).fill(false)); }\n    const setF = (r, c, val) => { if (r < 0 || c < 0 || r >= size || c >= size) return; m[r][c] = val; fn[r][c] = true; };\n    const finder = (r0, c0) => {\n      for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {\n        const ring = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6));\n        const core = r >= 2 && r <= 4 && c >= 2 && c <= 4;\n        setF(r0 + r, c0 + c, (ring || core) ? 1 : 0);\n      }\n    };\n    finder(0, 0); finder(0, size - 7); finde  t.file) el.setAttribute('src', t.file); }\n            }))\n          }))\n        };\n      }),\n      schedule: d.schedule,\n      socials: d.socials,\n\n      rsvpFields,\n      rsvpMessage: s.rsvpMessage || '\\u00a0',\n      rsvpYes: () => this.submitRsvp('coming'),\n      rsvpNo: () => this.submitRsvp('not'),\n      rsvpMaybe: () => this.submitRsvp('pending'),\n\n      requestFields,\n      requestMessage: s.requestMessage || '\\u00a0',\n      submitRequest: () => {\n        const r = s.request;\n        if (!r.name.trim()) { this.setState({ requestMessage: 'Name, please.' }); return; }\n        this.save(x => x.guests.push({ name: r.name.trim() + ' (requested)', status: 'pending', party: Number(r.party) || 1, note: r.note || 'Requested via landing page', dish: '', email: r.email || '' }));\n        this.setState({ requestMessage: 'Request received \\u2014 Bryan will get back to you.', request: { name: '', email: '', party: '', note: '' } });\n      },\n\n      newsEmail: s.newsEmail,\n      onNewsEmail: e => this.setState({ newsEmail: e.target.value, newsMessage: '' }),\n      newsMessage: s.newsMessage || '\\u00a0',\n      hostMailto: 'mailto:' + host,\n      subscribe: () => {\n        if (!s.newsEmail.includes('@')) { this.setState({ newsMessage: 'That email looks off.' }); return; }\n        this.setState({ newsMessage: 'Thanks \\u2014 you\\u2019re on the list.', newsEmail: '' });\n      },\n\n      bgRefA: el => { if (el) this.bgA = el; },\n      bgRefB: el => { if (el) this.bgB = el; },\n      qrRef: this.qrRef,\n      qrDownload: s.qrDownload,\n      qrReady: !!s.qrReady,\n\n      adminTabs, adminHint, adminFields, allGuests,\n      showGuestEditor, showListEditor, listRows, listEditorLabel, addRowLabel,\n      addGuest: () => this.save(x => x.guests.push({ name: 'New guest', status: 'pending', party: 1, note: '', dish: '', email: '' })),\n      importText: s.importText || '',\n      importMessage: s.importMessage || '\\u00a0',\n      onImportText: e => this.setState({ importText: e.target.value, importMessage: '' }),\n      onImportFile: e => {\n        const f = e.target.files && e.target.files[0];\n        if (!f) return;\n        const r = new FileReader();\n        r.onload = () => this.setState({ importText: String(r.result || ''), importMessage: 'Loaded ' + f.name + ' — review, then Add / Update.' });\n        r.readAsText(f);\n      },\n      copyEmailsLabel: s.copiedEmails ? 'COPIED' : 'COPY ALL EMAILS',\n      copyEmails: () => {\n        const list = merged.map(g => g.email).filter(Boolean).join(', ');\n        try { navigator.clipboard.writeText(list); } catch (e) {}\n        this.setState({ copiedEmails: true });\n        setTimeout(() => this.setState({ copiedEmails: false }), 1800);\n      },\n      mailAllUrl: 'https://mail.google.com/mail/?view=cm&fs=1&bcc=' +\n        encodeURIComponent(merged.map(g => g.email).filter(Boolean).join(',')) +\n        '&su=' + encodeURIComponent(ev.title) +\n        '&body=' + encodeURIComponent('Details and RSVP: https://' + ev.domain),\n      runImportMerge: () => this.importGuests('merge'),\n      runImportReplace: () => this.importGuests('replace'),\n      exportGuestCsv: () => {\n        const rows = [['Name','Email','Party','Status','Bringing','Message','Note']].concat(\n          merged.map(g => [g.name, g.email || '', g.party || 1, g.status, g.dish || '', g.message || '', g.note || '']));\n        const csv = rows.map(r => r.map(c => '\"' + String(c).replace(/\"/g, '\"\"') + '\"').join(',')).join('\\n');\n        const a = document.createElement('a');\n        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));\n        a.download = 'guest-list.csv'; a.click();\n      },\n      addListRow: () => this.addRow && this.addRow(),\n      exportData: () => {\n        const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });\n        const a = document.createElement('a');\n        a.href = URL.createObjectURL(blob); a.download = 'party-site-content.json'; a.click();\n      },\n      resetData: () => { try { localStorage.removeItem(KEY); } catch (e) {} this.setState({ data: DEFAULTS() }, () => this.applyTheme()); }\n    };\n  }\n\n  getPath(obj, path) {\n    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj) ?? '';\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
